<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Exelidoc</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
  <div class="exelidoc-panel">
    <div class="exelidoc-header">Exelidoc</div>
    <div class="subtitle"></div>

    <div id="settings">
      <div id="account-access">
        <label for="account-email-input">Email address</label>
        <input type="email" id="account-email-input" autocomplete="email" placeholder="you@example.com" />
        <label for="account-password-input">Password</label>
        <input type="password" id="account-password-input" minlength="8" maxlength="128" autocomplete="current-password" />
        <button id="sign-in-btn">Sign in</button>
        <button id="create-account-btn">Create account</button>
      </div>
      <div id="account-session" hidden>
        <button id="sign-out-btn" class="secondary-button">Sign out</button>
        <label for="new-password-input">Set or change password</label>
        <input type="password" id="new-password-input" minlength="8" maxlength="128" autocomplete="new-password" placeholder="At least 8 characters" />
        <button id="save-password-btn">Save password</button>
      </div>
      <div id="account-status" role="status" aria-live="polite"></div>
    </div>

    <div id="text-mode">
      <textarea id="instruction" placeholder="e.g. make this more formal, fix grammar... or write something new if nothing is selected"></textarea>
      <div id="hint" class="exelidoc-hint">Select text to edit it, or leave nothing selected to generate new text.</div>
      <button id="ask">Ask</button>
    </div>

    <div id="range-mode" hidden>
      <div class="exelidoc-hint">Select a range of cells, then click Clean Up. Formulas and numbers are left untouched -- only text cells get corrected.</div>
      <button id="clean">Clean Up Selected Range</button>
    </div>

    <button id="undo" hidden>Undo</button>
    <div id="status"></div>
    <div id="notes"></div>
    <details id="history-section">
      <summary>History</summary>
      <div class="history-content">
        <div class="history-heading">
          <span class="exelidoc-hint">Saved prompts and replies shared with linked apps.</span>
          <button id="refresh-history-btn" type="button" title="Refresh history" aria-label="Refresh history">↻</button>
        </div>
        <div id="history-list" aria-live="polite"></div>
        <button id="load-more-history-btn" class="secondary-button" type="button" hidden>Load older</button>
        <button id="clear-history-btn" class="secondary-button" type="button">Clear history</button>
      </div>
    </details>
  </div>
  <script src="taskpane.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Exelidoc</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Exelidoc</h1>
  </header>
  <main>
    <section id="settings-section">
      <label for="email-input">Email address</label>
      <input type="email" id="email-input" placeholder="you@example.com" autocomplete="email" required />
      <button id="create-account-btn">Create free account</button>
      <button id="sign-out-btn" hidden>Sign out</button>
      <p id="status">Create an account to use Exelidoc. Free accounts include 50 AI requests per 30 days.</p>
      <p class="account-note">Beta limitation: email ownership is not verified, and signing into an existing account on a fresh install is not available yet.</p>
    </section>

    <section id="generate-section">
      <label for="prompt-input">Generate text</label>
      <textarea id="prompt-input" rows="3" placeholder="e.g. a short email asking to reschedule Thursday's meeting"></textarea>
      <button id="generate-btn">Generate</button>
      <p id="generate-status"></p>
      <textarea id="result-output" rows="6" readonly placeholder="Generated text will appear here"></textarea>
      <button id="copy-btn" style="display:none;">Copy to clipboard</button>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're subscribed — Exelidoc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero" style="padding-bottom: 100px;">
    <span class="eyebrow">Subscription confirmed</span>
    <h1>You're in.</h1>
    <p id="message">Saving your session...</p>
    <p class="hint">We remember your account on this browser so you can use Exelidoc again without re-entering a secret key.</p>
  </header>

  <script>
    const BACKEND_URL = "https://exelidocv4-5.onrender.com";

    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("session_id");
    const sessionToken = params.get("session_token") || localStorage.getItem("exelidoc_session_token");
    const email = params.get("email") || localStorage.getItem("exelidoc_email") || "your account";
    const messageEl = document.getElementById("message");

    if (sessionToken) {
      localStorage.setItem("exelidoc_session_token", sessionToken);
      localStorage.setItem("exelidoc_email", email);
      messageEl.textContent = `Signed in as ${email}. We will remember you for your next Exelidoc session.`;
    } else if (sessionId) {
      fetch(`${BACKEND_URL}/api/auth/key-for-session?session_id=${encodeURIComponent(sessionId)}`)
        .then((res) => res.json())
        .then((data) => {
          if (data.session_token) {
            localStorage.setItem("exelidoc_session_token", data.session_token);
            localStorage.setItem("exelidoc_email", data.email || "");
            messageEl.textContent = `Subscribed as ${data.email} (${data.tier} plan). We will remember you for future Exelidoc use.`;
          } else {
            messageEl.textContent = data.error || "Could not load your session.";
          }
        })
        .catch(() => {
          messageEl.textContent = "Could not reach the server.";
        });
    } else {
      messageEl.textContent = "Missing session information.";
    }
  </script>
</body>
</html>

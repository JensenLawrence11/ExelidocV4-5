<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout status | Exelidoc</title>
  <style>
    :root { --ink: #17231d; --leaf: #b9ef68; --paper: #f4f4ed; --muted: #68736a; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; background: var(--ink); color: var(--paper); font: 16px/1.6 "Segoe UI", Arial, sans-serif; }
    main { width: min(100%, 560px); padding: 42px; border: 1px solid #526056; background: #202f27; }
    .eyebrow { color: var(--leaf); font: 12px Consolas, monospace; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: 40px; line-height: 1.1; }
    #message, .hint { color: #c4cec4; }
    .button { display: inline-flex; min-height: 46px; align-items: center; margin-top: 14px; padding: 0 18px; background: var(--leaf); color: var(--ink); font-weight: 700; text-decoration: none; }
    .site-status { margin: 28px 0 0; color: #9aa99b; font-size: 12px; }
    @media (max-width: 520px) { main { padding: 28px 22px; } h1 { font-size: 34px; } }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">Stripe checkout</span>
    <h1>Thanks. You're in.</h1>
    <p id="message" role="status" aria-live="polite">Confirming your subscription...</p>
    <p class="hint">Your Exelidoc extension session remains saved in your browser.</p>
    <a class="button" href="index.html#plans">Back to Exelidoc</a>
    <p class="site-status">Exelidoc may respond slowly because it relies on free-tier services and is still in development.</p>
  </main>
  <script>
    const BACKEND_URL = "https://exelidocv4-5.onrender.com";
    const sessionId = new URLSearchParams(window.location.search).get("session_id");
    const message = document.getElementById("message");
    if (sessionId) {
      fetch(`${BACKEND_URL}/api/auth/key-for-session?session_id=${encodeURIComponent(sessionId)}`)
        .then((response) => response.json())
        .then((data) => {
          if (data.email) {
            message.textContent = `Subscription confirmed for ${data.email} (${data.tier} plan).`;
          } else {
            message.textContent = data.error || "Checkout returned, but subscription status could not be loaded.";
          }
        })
        .catch(() => { message.textContent = "Could not reach Exelidoc to confirm your subscription. Check your account again shortly."; });
    } else {
      message.textContent = "No Stripe checkout session was included in this page address.";
    }
  </script>
</body>
</html>
